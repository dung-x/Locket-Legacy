name: iOS Build (Objective-C, iOS 12)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate Xcode project integrity
        run: |
          python3 - <<'PY'
          import re, sys
          t = open('LocketLegacy.xcodeproj/project.pbxproj').read()
          # 1. every object entry must live on exactly one balanced line
          #    (a split entry means nested garbage Xcode silently drops).
          body = t.split('objects = {', 1)[1].rsplit('rootObject', 1)[0]
          bad = [l for l in body.splitlines()
                 if l.strip() and l.strip() not in ('{', '}', '};')
                 and l.count('{') != l.count('}')]
          if bad:
              print('CORRUPT pbxproj lines (unbalanced braces):')
              [print('  ' + l.strip()[:160]) for l in bad]
              sys.exit(1)
          # 2. every source-phase ID must resolve to a top-level PBXBuildFile.
          tops = set(re.findall(r'^\t\t([0-9A-F]{24}) = \{isa = PBXBuildFile;', t, re.M))
          m = re.search(r'PBXSourcesBuildPhase.*?files = \((.*?)\);', t, re.S)
          ids = [x.strip() for x in m.group(1).split(',')]
          missing = [i for i in ids if i not in tops]
          print('sources: %d, top-level build files OK' % len(ids))
          if missing:
              print('CORRUPT: sources without top-level PBXBuildFile:', missing)
              sys.exit(1)
          # 3. every file ref (except the .app product) must belong to a group,
          #    or Xcode resolves its path against the repo root.
          refs = set(re.findall(r'^\t\t([0-9A-F]{24}) = \{isa = PBXFileReference;', t, re.M))
          grouped = set()
          for gm in re.finditer(r'children = \((.*?)\);', t, re.S):
              grouped.update(x.strip() for x in gm.group(1).split(',') if x.strip())
          orphans = [r for r in refs if r not in grouped and 'wrapper.application' not in
                     next((l for l in t.splitlines() if r in l), '')]
          if orphans:
              print('CORRUPT: file refs in no group (resolve to repo root):', orphans)
              sys.exit(1)
          print('pbxproj integrity OK')
          PY

      - name: Build (simulator, no signing)
        run: |
          xcrun simctl list devices available | head -n 30
          xcodebuild \
            -project LocketLegacy.xcodeproj \
            -scheme LocketLegacy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check mock server (no deps — node builtins only)
        run: node --check Server/server.js
      - name: Build mock API image
        run: docker build -t locketlegacy-api ./Server

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test mock API (login → upload picture → moments → dashboard)
        run: |
          set -e
          cd Server
          node server.js > /tmp/srv.log 2>&1 &
          SRV=$!
          trap "kill $SRV" EXIT
          for i in $(seq 1 20); do
            curl -sf http://localhost:5001/api/health && break
            sleep 1
          done
          curl -sf http://localhost:5001/api/health
          curl -sf http://localhost:5001/connect | grep -o 'locketlegacy://connect'
          curl -sf http://localhost:5001/ | grep -o 'Regenerate QR'
          TOK=$(curl -s -X POST http://localhost:5001/locket/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.co","password":"x"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['idToken'])")
          echo "token=$TOK"
          printf '\xff\xd8\xff\xe0fake-jpeg-bytes\xff\xd9' > pic.jpg
          curl -sf -X POST http://localhost:5001/locket/postMomentV1 \
            -H "Authorization: Bearer $TOK" \
            -F 'optionsData={"caption":"ci pic"}' \
            -F 'file=@pic.jpg;type=image/jpeg' | tee /tmp/up.json
          python3 - <<'PY'
          import json
          up = json.load(open('/tmp/up.json'))
          assert up['success'] is True, up
          url = up['data']['url']
          assert url.startswith('http://'), url  # absolute, phone-loadable
          assert up['data']['caption'] == 'ci pic', up
          print('upload OK:', url)
          PY
          URL=$(python3 -c "import json; print(json.load(open('/tmp/up.json'))['data']['url'])")
          curl -sf "$URL" -o /tmp/dl.jpg
          cmp pic.jpg /tmp/dl.jpg && echo "roundtrip bytes identical"
          curl -s -X POST http://localhost:5001/locket/getMomentV2 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['success'] and len(d['data'])==1 and d['data'][0]['caption']=='ci pic', d; print('moments OK')"
          echo "=== original 3-step flow: presigned -> PUT -> postMomentV2 ==="
          curl -sf -X POST http://localhost:5001/api/presignedV3 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d '{"filename":"locketdio_123_mock-uid-1_cliCI.jpg","contentType":"image/jpeg","type":"image","size":16,"uploadedAt":"2026-10-12T00:00:00.000Z"}' \
            | tee /tmp/pre.json
          python3 - <<'PY'
          import json
          pre = json.load(open('/tmp/pre.json'))
          assert pre['status'] == 'success', pre
          d = pre['data']
          assert d['url'] and d['publicURL'] and d['key'].startswith('LocketCloud/'), d
          assert d['expiresIn'] == 300, d
          open('/tmp/put_url.txt', 'w').write(d['url'])
          open('/tmp/pub_url.txt', 'w').write(d['publicURL'])
          open('/tmp/key.txt', 'w').write(d['key'])
          print('presigned OK:', d['key'])
          PY
          curl -sf -X PUT --data-binary @pic.jpg -H 'Content-Type: image/jpeg' "$(cat /tmp/put_url.txt)" | tee /tmp/put.json
          python3 -c "import json; j=json.load(open('/tmp/put.json')); assert j['status']=='success', j; print('PUT OK')"
          PUB=$(cat /tmp/pub_url.txt); KEY=$(cat /tmp/key.txt)
          curl -sf -X POST http://localhost:5001/locket/postMomentV2 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d "{\"model\":\"Version-UploadmediaV3.1\",\"mediaInfo\":{\"url\":\"$PUB\",\"path\":\"$KEY\",\"name\":\"locketdio_123_mock-uid-1_cliCI.jpg\",\"size\":16,\"uploadedAt\":\"2026-10-12T00:00:00.000Z\",\"type\":\"image\"},\"options\":{\"caption\":\"ci v2\",\"audience\":\"all\",\"recipients\":[]},\"contentType\":\"image\"}" \
            | tee /tmp/v2.json
          python3 -c "import json; j=json.load(open('/tmp/v2.json')); assert j['success'] is True, j; print('postMomentV2 OK')"
          curl -s "$PUB" -o /tmp/dl2.jpg
          cmp pic.jpg /tmp/dl2.jpg && echo "v2 roundtrip bytes identical"
          curl -s -X POST http://localhost:5001/locket/getMomentV2 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); caps=[m['caption'] for m in d['data']]; assert 'ci v2' in caps, d; print('v2 moments OK:', caps)"
          echo "=== invalid mime rejected (parity with upstream allow-list) ==="
          curl -s -o /dev/null -w '%{http_code}\n' -X POST http://localhost:5001/api/presignedV3 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d '{"filename":"x.exe","contentType":"application/x-msdownload","type":"image","size":3}' | grep -q 400 && echo "mime guard OK"
          echo "=== social extras: overlays, react, chat, streak, push ==="
          curl -sf http://localhost:5001/api/overlays | python3 -c "import json,sys; d=json.load(sys.stdin)['data']; assert 'decorative' in d and d['decorative'][0]['overlay_id']=='standard', d; print('overlays OK')"
          MID=$(python3 -c "import json; print(json.load(open('/tmp/v2.json'))['data']['id'])")
          curl -sf -X POST http://localhost:5001/locket/reactToMoment \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d "{\"momentId\":\"$MID\",\"emoji\":\"❤️\"}" | python3 -c "import json,sys; j=json.load(sys.stdin); assert j['success'] and j['data']['reactions']['❤️']==1, j; print('react OK')"
          curl -sf -X POST http://localhost:5001/locket/sendMessage \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d '{"text":"hello chat"}' | python3 -c "import json,sys; j=json.load(sys.stdin); assert j['success'] and j['data']['text']=='hello chat', j; print('send OK')"
          curl -sf -X POST http://localhost:5001/locket/getAllMessageV2 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert any(m['text']=='hello chat' for m in d['data']), d; print('chat read OK')"
          curl -s -X POST http://localhost:5001/locket/getMomentV2 \
            -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['streak']['count']>=1, d.get('streak'); assert d['data'][0]['reactions']['❤️']==1, d['data'][0]; print('streak+reactions OK:', d['streak'])"
          curl -sf -X POST http://localhost:5001/api/push/register \
            -H 'Content-Type: application/json' -d '{"token":"abc123","platform":"ios"}' \
            | python3 -c "import json,sys; j=json.load(sys.stdin); assert j['success'], j; print('push register OK')"
