name: iOS Build (Objective-C, iOS 12)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (simulator, no signing)
        run: |
          xcrun simctl list devices available | head -n 30
          xcodebuild \
            -project LocketLegacy.xcodeproj \
            -scheme LocketLegacy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check mock server (no deps — node builtins only)
        run: node --check Server/server.js
      - name: Build mock API image
        run: docker build -t locketlegacy-api ./Server
