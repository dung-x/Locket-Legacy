name: iOS IPA (unsigned) + Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (iphoneos, no signing)
        run: |
          set -eux
          rm -rf build Payload *.ipa
          mkdir -p build
          xcodebuild \
            -project LocketLegacy.xcodeproj \
            -scheme LocketLegacy \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/LocketLegacy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          echo "=== xcarchive contents ==="
          find build/LocketLegacy.xcarchive -maxdepth 4 | head -n 40
          APP_PATH=$(find build/LocketLegacy.xcarchive/Products/Applications -name "*.app" -maxdepth 2 | head -n 1)
          echo "APP_PATH=$APP_PATH"
          test -d "$APP_PATH"
          MAIN_BIN=$(basename "$APP_PATH" .app)
          echo "MAIN_BIN=$MAIN_BIN"
          # FAIL LOUDLY if the executable is missing (this was the v1.0.0 bug:
          # Sources phase referenced wrong IDs so the .app shipped without a binary
          # -> device error "Failed to unhide archs ... LocketLegacy.app/LocketLegacy").
          test -f "$APP_PATH/$MAIN_BIN"
          ls -lh "$APP_PATH/$MAIN_BIN"
          otool -l "$APP_PATH/$MAIN_BIN" | grep -A2 LC_BUILD_VERSION | head -n 10 || true
          lipo -info "$APP_PATH/$MAIN_BIN" || true
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Ad-hoc sign so the binary carries a signature (installable via
          # TrollStore / re-signable via Sideloadly/AltStore; still NOT App Store).
          codesign --force --sign - --deep "Payload/$MAIN_BIN.app" || true
          codesign -dv "Payload/$MAIN_BIN.app" || true
          test -f "Payload/$MAIN_BIN.app/$MAIN_BIN"
          zip -r LocketLegacy-unsigned.ipa Payload
          ls -lh *.ipa
          unzip -l LocketLegacy-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocketLegacy-unsigned-ipa
          path: LocketLegacy-unsigned.ipa
          if-no-files-found: error

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LocketLegacy ${{ inputs.tag }} (unsigned IPA)
          body: |
            IPA built from `main` (Objective-C, iOS 12+), ad-hoc signed.

            - File: `LocketLegacy-unsigned.ipa` (ad-hoc signature only — NOT App Store / stock-installable as-is).
            - v1.0.0 was broken (empty .app, no executable → `Failed to unhide archs` at 1%). This release fixes the Xcode Sources phase so the binary is included, and the workflow now fails loudly if the binary is missing.
            - Install options:
              1. Sideloadly / AltStore with your own Apple ID (they re-sign with a free 7-day cert) — recommended for stock devices.
              2. TrollStore (if your iOS version supports it) can install the ad-hoc IPA more directly.
              3. Direct `ideviceinstaller` / Apple Configurator without re-signing will still fail — that is expected for an unsigned/ad-hoc build.
            - Backend mock: `docker compose up -d --build` (API on :5001), then set API URL on the Login screen.
          files: LocketLegacy-unsigned.ipa
          fail_on_unmatched_files: true
